# Render Blueprint: New → Blueprint → choose this repository.
# Free plan: sleeps after 15 min idle and has no persistent disk (the SQLite database
# resets on every restart). BankID, Vipps and card run in test mode until keys are added.
services:
  - type: web
    name: nordic-boxing-center
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/config
    envVars:
      - key: NODE_VERSION
        value: "24"
      # Demo only: Render sets NODE_ENV=production, which otherwise refuses simulated
      # BankID/Vipps/card. Remove this once the real keys are added.
      - key: ALLOW_TEST_MODE
        value: "true"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
