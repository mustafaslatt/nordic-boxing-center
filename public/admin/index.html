<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Admin – Nordic Boxing Center</title>
<link rel="icon" type="image/png" href="/assets/icon-192.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/base.css">
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
<div id="ribbon" class="test-ribbon" hidden>Testmodus: BankID og betalinger er simulert.</div>

<!-- Login -->
<main id="login" class="login" hidden>
  <form class="card login-card" id="login-form">
    <div class="brand"><img class="brand-logo" src="/assets/logo.jpg" alt="Nordic Boxing Center" width="459" height="459"><small class="brand-tag">Admin</small></div>
    <h1>Logg inn</h1>
    <label>E-post<input name="email" type="email" autocomplete="username" required></label>
    <label>Passord<input name="password" type="password" autocomplete="current-password" required></label>
    <button class="btn btn-primary" type="submit">Logg inn</button>
    <div id="login-err"></div>
  </form>
</main>

<!-- App -->
<div id="app" class="app" hidden>
  <aside class="side">
    <div class="brand"><img class="brand-logo" src="/assets/logo.jpg" alt="Nordic Boxing Center" width="459" height="459"><small class="brand-tag">Admin</small></div>
    <nav class="nav" aria-label="Admin">
      <a href="#/" data-nav="oversikt">Oversikt</a>
      <a href="#/medlemmer" data-nav="medlemmer">Medlemmer</a>
      <a href="#/betalinger" data-nav="betalinger">Betalinger</a>
      <a href="#/innstillinger" data-nav="innstillinger">Innstillinger</a>
      <a href="#/logg" data-nav="logg">Logg</a>
    </nav>
    <div class="side-foot">
      <span id="me" class="muted"></span>
      <a href="/" target="_blank" rel="noopener">Åpne nettsiden ↗</a>
      <button class="btn btn-ghost btn-sm" id="logout" type="button">Logg ut</button>
    </div>
  </aside>
  <main class="content" id="view" tabindex="-1"></main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="/admin/admin.js"></script>
</body>
</html>
