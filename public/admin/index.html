<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Admin – Nordic Boxing Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/base.css">
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
<div id="ribbon" class="test-ribbon" hidden>Testmodus: BankID og betalinger er simulert.</div>

<!-- Login -->
<main id="login" class="login" hidden>
  <form class="card login-card" id="login-form">
    <div class="brand"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 32 32" fill="#0a1628"><path d="M12 4.5c-3.6 0-6.5 2.9-6.5 6.5v6.2c0 1.3.5 2.5 1.4 3.4l1.6 1.6V26c0 .8.7 1.5 1.5 1.5h8.5c.8 0 1.5-.7 1.5-1.5v-3.1l2.1-2.3c1-1.1 1.5-2.5 1.5-4V12.5c0-1.9-1.6-3.5-3.5-3.5h-.6C19.2 6.4 16.9 4.5 14 4.5h-2zm-.5 4h5c1.7 0 3 1.3 3 3v1h-8v-4zm-2 21h12v1.5h-12z"/></svg></span><span><b>Nordic</b><small>Admin</small></span></div>
    <h1>Logg inn</h1>
    <label>E-post<input name="email" type="email" autocomplete="username" required></label>
    <label>Passord<input name="password" type="password" autocomplete="current-password" required></label>
    <button class="btn btn-primary" type="submit">Logg inn</button>
    <div id="login-err"></div>
  </form>
</main>

<!-- App -->
<div id="app" class="app" hidden>
  <aside class="side">
    <div class="brand"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 32 32" fill="#0a1628"><path d="M12 4.5c-3.6 0-6.5 2.9-6.5 6.5v6.2c0 1.3.5 2.5 1.4 3.4l1.6 1.6V26c0 .8.7 1.5 1.5 1.5h8.5c.8 0 1.5-.7 1.5-1.5v-3.1l2.1-2.3c1-1.1 1.5-2.5 1.5-4V12.5c0-1.9-1.6-3.5-3.5-3.5h-.6C19.2 6.4 16.9 4.5 14 4.5h-2zm-.5 4h5c1.7 0 3 1.3 3 3v1h-8v-4zm-2 21h12v1.5h-12z"/></svg></span><span><b>Nordic</b><small>Admin</small></span></div>
    <nav class="nav" aria-label="Admin">
      <a href="#/" data-nav="oversikt">Oversikt</a>
      <a href="#/medlemmer" data-nav="medlemmer">Medlemmer</a>
      <a href="#/betalinger" data-nav="betalinger">Betalinger</a>
      <a href="#/innstillinger" data-nav="innstillinger">Innstillinger</a>
      <a href="#/logg" data-nav="logg">Logg</a>
    </nav>
    <div class="side-foot">
      <span id="me" class="muted"></span>
      <a href="/" target="_blank" rel="noopener">Åpne nettsiden ↗</a>
      <button class="btn btn-ghost btn-sm" id="logout" type="button">Logg ut</button>
    </div>
  </aside>
  <main class="content" id="view" tabindex="-1"></main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="/admin/admin.js"></script>
</body>
</html>
